<script>
"use strict";

/* ---------- Kurzhelfer ---------- */
const $  = (sel,el=document)=>el.querySelector(sel);
const el = (tag,props={})=>Object.assign(document.createElement(tag),props);
const app = $("#app");

const heute = ()=> new Date();
const aktMonat = ()=>{const d=heute();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");};
const monatLesbar = (m)=>{const [j,mo]=m.split("-");const n=["Jan","Feb","März","Apr","Mai","Juni","Juli","Aug","Sept","Okt","Nov","Dez"];return n[+mo-1]+" "+j;};
const esc = (s)=> (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(text,fehler=false){
  const t=$("#toast"); t.textContent=text; t.className=(fehler?"fehler ":"")+"zeig";
  clearTimeout(t._to); t._to=setTimeout(()=>t.className="",3200);
}
function laden(an){ $("#laden").classList.toggle("zeig",!!an); }

/* ---------- Supabase ---------- */
let sb=null;
function initSupabase(){
  if(!CONFIG.SUPABASE_URL||CONFIG.SUPABASE_URL.startsWith("HIER")){
    app.innerHTML='<div class="karte" style="margin-top:40px"><h2>Noch nicht eingerichtet</h2>'
      +'<p class="klein">In dieser Datei fehlen oben im Abschnitt <b>KONFIGURATION</b> noch deine Supabase-Werte '
      +'(URL, Schlüssel, Firmen-E-Mail). Trag sie ein, dann läuft die App. Die Schritte stehen in der Datei SETUP.md.</p></div>';
    return false;
  }
  sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  return true;
}

/* ---------- Bilder (privater Bucket → signierte URLs) ---------- */
const urlCache = new Map();
async function bildUrl(pfad){
  if(!pfad) return null;
  if(urlCache.has(pfad)) return urlCache.get(pfad);
  const {data,error} = await sb.storage.from("medien").createSignedUrl(pfad,3600);
  if(error){ console.warn(error); return null; }
  urlCache.set(pfad,data.signedUrl); return data.signedUrl;
}
async function fuelleBilder(container=document){
  const imgs=[...container.querySelectorAll("img[data-pfad]")];
  await Promise.all(imgs.map(async img=>{
    const u=await bildUrl(img.dataset.pfad);
    if(u){ img.src=u; img.classList.remove("leer"); }
  }));
}

/* Foto verkleinern + als JPEG-Blob */
function komprimiere(file,maxKante=1280,q=0.72){
  return new Promise((res,rej)=>{
    const img=new Image(); const rd=new FileReader();
    rd.onerror=rej; img.onerror=rej;
    rd.onload=()=>{img.src=rd.result;};
    img.onload=()=>{
      let {width:w,height:h}=img;
      if(w>h && w>maxKante){h=Math.round(h*maxKante/w);w=maxKante;}
      else if(h>maxKante){w=Math.round(w*maxKante/h);h=maxKante;}
      const c=el("canvas"); c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      c.toBlob(b=> b?res(b):rej(new Error("Bild konnte nicht verarbeitet werden")),"image/jpeg",q);
    };
    rd.readAsDataURL(file);
  });
}
async function fotoHochladen(pfad,blob){
  const {error}=await sb.storage.from("medien").upload(pfad,blob,{upsert:true,contentType:blob.type||"image/jpeg"});
  if(error) throw error;
  urlCache.delete(pfad);
  return pfad;
}

/* ---------- kleiner Router ---------- */
const stack=[];  // Verlauf für den Zurück-Knopf
function zeige(renderFn,titel){
  stack.push({renderFn,titel});
  render();
}
function zurueck(){ if(stack.length>1){stack.pop();render();} }
function ersetze(renderFn,titel){ stack.pop(); zeige(renderFn,titel); }
async function render(){
  const cur=stack[stack.length-1];
  $("#kopfbalken").style.display="flex";
  $("#kopfTitel").textContent=cur.titel||"";
  $("#btnZurueck").style.display = stack.length>1 ? "block":"none";
  fab.innerHTML=""; fab.style.display="none";
  app.innerHTML='<div style="padding:30px;text-align:center" class="klein">…</div>';
  try{ await cur.renderFn(); }
  catch(e){ console.error(e); app.innerHTML='<div class="karte"><b>Fehler:</b> '+esc(e.message||e)+'</div>'; }
}
$("#btnZurueck").onclick=zurueck;

function setFab(html,onclick){
  fab.innerHTML=html; fab.style.display="block";
  const b=fab.querySelector("button"); if(b&&onclick) b.onclick=onclick;
}

  stack.length=0;
  $("#kopfbalken").style.display="none"; fab.style.display="none";
  app.innerHTML=`
    <div class="login-wrap">

    </div>`;
  const tryLogin=async()=>{
    const pw=$("#pw").value.trim();
    if(!pw){ $("#loginFehler").textContent="Bitte Passwort eingeben."; return; }
    laden(true);
    const {error}=await sb.auth.signInWithPassword({email:CONFIG.FIRMEN_EMAIL,password:pw});
    laden(false);
    if(error){ $("#loginFehler").textContent="Passwort stimmt nicht (oder Login noch nicht angelegt)."; return; }
    starteApp();
  };
  $("#btnLogin").onclick=tryLogin;
  $("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")tryLogin();});

async function abmelden(){
  await sb.auth.signOut(); urlCache.clear(); zeigeLogin();

  $("#btnFahrer").onclick=()=>zeige(zeigeFahrerListe,"Fahrer");
  $("#btnScan").onclick=()=>zeige(zeigeScanner,"QR scannen");

      <label class="feld">Foto vom Werkzeug</label>
      <div class="zeile">
        <img class="thumb ${w.foto_pfad?"":"leer"}" id="prevFoto" ${w.foto_pfad?`data-pfad="${esc(w.foto_pfad)}"`:""}>${w.foto_pfad?"":"📷"}
        <input type="file" accept="image/*" capture="environment" id="fFoto" style="flex:1">
      </div>

      <label class="feld">Foto eines vorhandenen Bar-/QR-Codes (optional)</label>
      <div class="zeile">
        <img class="thumb ${w.code_foto_pfad?"":"leer"}" id="prevCode" ${w.code_foto_pfad?`data-pfad="${esc(w.code_foto_pfad)}"`:""}>${w.code_foto_pfad?"":"🏷️"}
        <input type="file" accept="image/*" capture="environment" id="fCode" style="flex:1">
      </div>
      <div class="klein" style="margin-top:12px">Den <b>aufklebbaren</b> QR-Code erzeugt die App selbst — den findest du nach dem Speichern in der Werkzeug-Ansicht und im QR-Bogen.</div>
    </div>`;
  await fuelleBilder(app);

  // Vorschau der frisch gewählten Datei
  const vorschau=(inp,imgId)=>{ inp.onchange=()=>{ const fl=inp.files[0]; if(fl){ const img=$("#"+imgId); img.src=URL.createObjectURL(fl); img.classList.remove("leer"); img.textContent=""; } }; };
  vorschau($("#fFoto"),"prevFoto"); vorschau($("#fCode"),"prevCode");

  setFab(`<button class="btn">${vorhanden?"Speichern":"Anlegen"}</button>`, async()=>{
    const name=$("#wname").value.trim();
    if(!name){ toast("Bezeichnung fehlt.",true); return; }
    const rec={fahrzeug_id:fahrzeugId,name,anzahl:parseInt($("#wanz").value||"1",10),seriennummer:$("#wsn").value.trim()||null};
    laden(true);
    try{
      let id=vorhanden?.id;
      if(vorhanden){ const {error}=await sb.from("werkzeuge").update(rec).eq("id",id); if(error)throw error; }
      else{ const {data,error}=await sb.from("werkzeuge").insert(rec).select("id").single(); if(error)throw error; id=data.id; }
      // Fotos (falls neu gewählt)
      const upd={};
      const ff=$("#fFoto").files[0];
      if(ff){ const b=await komprimiere(ff); upd.foto_pfad=await fotoHochladen(`werkzeuge/${id}/foto_${Date.now()}.jpg`,b); }
      const fc=$("#fCode").files[0];
      if(fc){ const b=await komprimiere(fc); upd.code_foto_pfad=await fotoHochladen(`werkzeuge/${id}/code_${Date.now()}.jpg`,b); }
      if(Object.keys(upd).length){ const {error}=await sb.from("werkzeuge").update(upd).eq("id",id); if(error)throw error; }
      toast("Gespeichert."); zurueck();
    }catch(e){ toast(e.message,true); } finally{ laden(false); }
  });
}

/* ---------- Werkzeug-Detail (mit QR) ---------- */
async function zeigeWerkzeug(id){
  const {data:w,error}=await sb.from("werkzeuge").select("*, fahrzeuge(kennzeichen)").eq("id",id).single();
  if(error) throw error;
  app.innerHTML=`
    <div class="kopf"><h1 style="font-size:21px">${esc(w.name)}</h1></div>
    ${w.foto_pfad?`<img class="foto-gross" data-pfad="${esc(w.foto_pfad)}" alt="" style="margin-bottom:12px">`:""}
    <div class="karte">
      <div class="klein">Fahrzeug</div><div style="font-weight:700;margin-bottom:8px">${esc(w.fahrzeuge?.kennzeichen||"—")}</div>
      <div class="klein">Anzahl</div><div style="font-weight:700;margin-bottom:8px">${w.anzahl??1}</div>
      ${w.seriennummer?`<div class="klein">Seriennummer</div><div style="font-weight:700;margin-bottom:8px">${esc(w.seriennummer)}</div>`:""}
      ${w.code_foto_pfad?`<div class="klein">Vorhandener Code (Foto)</div><img class="foto-gross" data-pfad="${esc(w.code_foto_pfad)}" alt="" style="max-height:180px">`:""}
    </div>
    <div class="karte" style="text-align:center">
      <div class="klein" style="margin-bottom:8px">Aufklebbarer QR-Code</div>
      <canvas id="qr" style="width:180px;height:180px"></canvas>
      <div class="klein" style="margin-top:6px">Scannen öffnet genau dieses Werkzeug.</div>
    </div>`;
  await fuelleBilder(app);
  const ziel=`${location.origin}${location.pathname}?w=${w.id}`;
  QRCode.toCanvas($("#qr"),ziel,{width:180,margin:1},err=>{ if(err)console.warn(err); });

  setFab(`<div class="btn-reihe">
      <button class="btn geist" style="flex:1" id="wEdit">Bearbeiten</button>
      <button class="btn gefahr" style="flex:1" id="wDel">Löschen</button></div>`);
  $("#wEdit").onclick=()=>zeige(()=>formWerkzeug(w.fahrzeug_id,w),"Werkzeug bearbeiten");
  $("#wDel").onclick=async()=>{
    if(!confirm(`„${w.name}" wirklich löschen?`)) return;
    laden(true);
    const {error}=await sb.from("werkzeuge").delete().eq("id",w.id);
    laden(false);
    if(error){ toast(error.message,true); return; }
    toast("Gelöscht."); zurueck();
  };
}

/* ---------- QR-Bogen drucken ---------- */
function druckeQrBogen(f,wz){
  if(!wz.length){ toast("Keine Werkzeuge zum Drucken.",true); return; }
  const db=$("#druckbereich");
  db.innerHTML=`<h2 style="padding:8mm 8mm 0">${esc(f.kennzeichen)} — ${esc(f.bezeichnung||"")}</h2>
    <div class="qr-grid">${wz.map(w=>`<div class="qr-label"><canvas data-ziel="${location.origin}${location.pathname}?w=${w.id}"></canvas>
      <div class="nm">${esc(w.name)}</div><div class="sub">${esc(f.kennzeichen)}${w.seriennummer?" · "+esc(w.seriennummer):""}</div></div>`).join("")}</div>`;
  const canvases=[...db.querySelectorAll("canvas")];
  Promise.all(canvases.map(c=>new Promise(r=>QRCode.toCanvas(c,c.dataset.ziel,{width:260,margin:1},()=>r()))))
    .then(()=>{ window.print(); });
}

/* ============================================================ */
/*  MONATSCHECK + UNTERSCHRIFT                                  */
/* ============================================================ */
async function zeigeMonatscheck(f){
  const m=aktMonat();
  const {data:fahrer}=await sb.from("fahrer").select("*").order("name");
  const {data:vorhanden}=await sb.from("bestaetigungen").select("*").eq("fahrzeug_id",f.id).eq("monat",m).limit(1);
  const schon=vorhanden&&vorhanden[0];

  app.innerHTML=`
    <div class="kopf"><h1>Monatscheck</h1></div>
    <div class="karte">
      <div class="kennz">${esc(f.kennzeichen)}</div>
      <div class="klein">${esc(f.bezeichnung||"")} · ${monatLesbar(m)}</div>
    </div>
    ${schon?`<div class="karte" style="background:#E7F2E8;border-color:#bfe0c3"><b>Für ${monatLesbar(m)} liegt schon eine Bestätigung vor</b><div class="klein">(${esc(schon.fahrer_name||"")}, ${new Date(schon.erstellt).toLocaleDateString("de-DE")}). Eine neue ersetzt die alte.</div></div>`:""}
    <div class="karte">
      <label class="zeile" style="gap:10px;cursor:pointer">
        <input type="checkbox" id="cbVoll" checked style="width:22px;height:22px;flex:none">
        <span style="font-weight:700">Alle Werkzeuge vollständig und einsatzbereit</span>
      </label>
      <label class="feld">Bemerkung (bei Mängeln)</label>
      <textarea id="bem" placeholder="z.B. Akku vom Schrauber defekt – Ersatz bestellt"></textarea>
      <label class="feld">Ich bestätige als *</label>
      <select id="wer"><option value="">— Fahrer wählen —</option>
        ${(fahrer||[]).map(fr=>`<option value="${fr.id}" ${f.fahrer_id===fr.id?"selected":""}>${esc(fr.name)}</option>`).join("")}
      </select>
      <label class="feld">Unterschrift *</label>
      <canvas id="sigpad"></canvas>
      <div style="margin-top:8px"><button class="btn geist klein" id="sigClear">Unterschrift löschen</button></div>
    </div>`;

  const sig=initSigPad($("#sigpad"));

  setFab(`<button class="btn">Bestätigen &amp; speichern</button>`, async()=>{
    const wer=$("#wer").value;
    if(!wer){ toast("Bitte Fahrer wählen.",true); return; }
    if(sig.leer()){ toast("Bitte unterschreiben.",true); return; }
    const fname=(fahrer.find(x=>x.id===wer)||{}).name||null;
    laden(true);
    try{
      // alte Bestätigung des Monats entfernen (Ersetzen)
      if(schon){ await sb.from("bestaetigungen").delete().eq("fahrzeug_id",f.id).eq("monat",m); }
      const {data,error}=await sb.from("bestaetigungen").insert({
        fahrzeug_id:f.id, fahrer_id:wer, fahrer_name:fname, monat:m,
        vollstaendig:$("#cbVoll").checked, bemerkung:$("#bem").value.trim()||null
      }).select("id").single();
      if(error) throw error;
      const blob=await sig.blob();
      const pfad=await fotoHochladen(`unterschriften/${f.id}/${m}.png`,blob);
      await sb.from("bestaetigungen").update({unterschrift_pfad:pfad}).eq("id",data.id);
      toast("Monatscheck gespeichert.");
      stack.pop(); render(); // zurück ins Fahrzeug, frisch geladen
    }catch(e){ toast(e.message,true); } finally{ laden(false); }
  });
  $("#sigClear").onclick=sig.clear;
}

/* Unterschrift-Feld (Canvas, Touch+Maus) */
function initSigPad(canvas){
  const ctx=canvas.getContext("2d");
  function fit(){ const r=canvas.getBoundingClientRect(); const dpr=window.devicePixelRatio||1;
    canvas.width=r.width*dpr; canvas.height=r.height*dpr; ctx.scale(dpr,dpr);
    ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.strokeStyle="#111"; }
  fit();
  let zeichnet=false, benutzt=false, lx=0, ly=0;
  const pos=e=>{ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  canvas.addEventListener("pointerdown",e=>{ zeichnet=true;benutzt=true; const p=pos(e);lx=p.x;ly=p.y; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove",e=>{ if(!zeichnet)return; const p=pos(e); ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke(); lx=p.x;ly=p.y; });
  canvas.addEventListener("pointerup",()=>zeichnet=false);
  canvas.addEventListener("pointercancel",()=>zeichnet=false);
  return {
    leer:()=>!benutzt,
    clear:()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); benutzt=false; },
    blob:()=>new Promise(res=>canvas.toBlob(res,"image/png"))
  };
}

/* ============================================================ */
/*  QR-SCANNER                                                  */
/* ============================================================ */
let scanner=null;
async function zeigeScanner(){
  app.innerHTML=`<div class="kopf"><h1>QR scannen</h1></div>
    <div class="karte"><div id="reader"></div>
    <div class="klein" style="margin-top:10px">Halte den QR-Code am Werkzeug vor die Kamera.</div></div>`;
  try{
    scanner=new Html5Qrcode("reader");
    await scanner.start({facingMode:"environment"},{fps:10,qrbox:240},txt=>{
      let id=null; try{ id=new URL(txt).searchParams.get("w"); }catch{ /* evtl. reiner Text */ }
      if(id){ stopScanner(); ersetze(()=>zeigeWerkzeug(id),"Werkzeug"); }
      else toast("Kein bekannter Werkzeug-Code.",true);
    });
  }catch(e){ app.innerHTML+=`<div class="karte">Kamera nicht verfügbar: ${esc(e.message||e)}<br><span class="klein">Tipp: QR mit der normalen Handy-Kamera scannen – der Link öffnet das Werkzeug direkt.</span></div>`; }
  // Beim Verlassen Kamera stoppen
  const obs=new MutationObserver(()=>{ if(!document.getElementById("reader")){ stopScanner(); obs.disconnect(); } });
  obs.observe(app,{childList:true});
}
function stopScanner(){ if(scanner){ scanner.stop().catch(()=>{}).then(()=>{scanner.clear?.();scanner=null;}); } }

/* ============================================================ */
/*  START                                                       */
/* ============================================================ */
async function starteApp(){
  stack.length=0;
  // Deep-Link ?w=<werkzeug-id> ?
  const wid=new URLSearchParams(location.search).get("w");
  if(wid){
    history.replaceState({},"",location.pathname); // Param entfernen
    zeige(zeigeUebersicht,"Fahrzeuge");
    zeige(()=>zeigeWerkzeug(wid),"Werkzeug");
  }else{
    zeige(zeigeUebersicht,"Fahrzeuge");
  }
}

(async function boot(){
  if(!initSupabase()) return;
  laden(true);
  const {data}=await sb.auth.getSession();
  laden(false);
  if(data?.session) starteApp(); else zeigeLogin();
})();
</script>
